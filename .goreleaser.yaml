# GoReleaser configuration, used by .github/workflows/release.yml on tag push.
# Local check: goreleaser check && goreleaser release --snapshot --clean
version: 2

project_name: excentrico-tools-go

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: excentrico-tools-go
    main: .
    binary: excentrico-tools-go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - configuration.json.example
      - templates/**
      - metadata/**

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
